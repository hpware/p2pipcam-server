# Example nginx vhost for www.p2pipcam.com.
#
# TCP 80 is handled here; the camera's raw HTTP-over-UDP request is handled by
# `fake_cloud.py --port 80 --no-tcp` (UDP 80 does not conflict with nginx).
#
# Keep the DNS record DNS-only (grey cloud): Cloudflare's proxy does not pass
# UDP 80 or UDP 30000-30004.

server {
    listen 80;
    server_name www.p2pipcam.com;

    location = /api/userip.asp {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
